[project]
name = "astrbot-plugin-qq-message-guard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "aiosqlite>=0.20,<1", "Pillow>=10.4,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
